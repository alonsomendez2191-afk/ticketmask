  <text class="s" x="88" y="164" text-anchor="middle">CSV · JSON</text>
  <rect class="box" x="174" y="120" width="104" height="60" rx="10"/>
  <text class="t" x="226" y="155" text-anchor="middle">Normalize</text>
  <rect class="box" x="312" y="120" width="104" height="60" rx="10"/>
  <text class="t" x="364" y="146" text-anchor="middle">Detect</text>
  <text class="s" x="364" y="164" text-anchor="middle">Presidio</text>
  <rect class="box" x="450" y="120" width="104" height="60" rx="10"/>
  <text class="t" x="502" y="146" text-anchor="middle">Determine</text>
  <text class="t" x="502" y="164" text-anchor="middle">masking</text>
  <rect class="key" x="588" y="120" width="104" height="60" rx="10"/>
  <text class="t" x="640" y="155" text-anchor="middle">Mask</text>
  <rect class="box" x="726" y="120" width="104" height="60" rx="10"/>
  <text class="t" x="778" y="146" text-anchor="middle">Local model</text>
  <text class="s" x="778" y="164" text-anchor="middle">Ollama</text>
  <rect class="box" x="864" y="120" width="104" height="60" rx="10"/>
  <text class="t" x="916" y="146" text-anchor="middle">Masked data</text>
  <text class="s" x="916" y="164" text-anchor="middle">&lt;CONTACT_1&gt;</text>
  <rect class="box" x="1026" y="120" width="136" height="60" rx="10"/>
  <text class="t" x="1094" y="140" text-anchor="middle">Closed-source</text>
  <text class="t" x="1094" y="158" text-anchor="middle">model</text>
