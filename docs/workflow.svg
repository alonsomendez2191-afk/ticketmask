  <path class="a" d="M416,150 H448" marker-end="url(#h)"/>
  <path class="a" d="M554,150 H586" marker-end="url(#h)"/>
  <path class="a" d="M692,150 H724" marker-end="url(#h)"/>
  <path class="a" d="M830,150 H862" marker-end="url(#h)"/>
  <path class="a" d="M968,150 H1024" marker-end="url(#h)"/>

  <path class="a" d="M640,180 V214" marker-end="url(#h)"/>
  <rect class="in" x="580" y="216" width="120" height="44" rx="8"/>
  <text class="t" x="640" y="236" text-anchor="middle">Vault</text>
  <text class="s" x="640" y="252" text-anchor="middle">encrypted · audit</text>
