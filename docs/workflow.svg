<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1192 300" width="1192" height="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="ticketmask workflow">
  <title>ticketmask workflow</title>
  <style>
    .bg{fill:#ffffff}
    .local{fill:#edf3fb;stroke:#c3d4ec}
    .ext{fill:#f4f0fa;stroke:#d3c6e8}
    .box{fill:#ffffff;stroke:#b9b9b4;stroke-width:1.2}
    .in{fill:#f6f6f3;stroke:#b9b9b4;stroke-width:1.2;stroke-dasharray:4 3}
    .key{fill:#ffffff;stroke:#b5562b;stroke-width:1.8}
    .t{fill:#1a1a19;font-size:15px;font-weight:600}
    .s{fill:#6b6b68;font-size:11.5px}
    .z{fill:#8a8a85;font-size:11px;letter-spacing:.12em;font-weight:600}
    .a{stroke:#7b7b77;stroke-width:1.4;fill:none}
    .ah{fill:#7b7b77}
    @media (prefers-color-scheme:dark){
      .bg{fill:#191918}
      .local{fill:#1b2330;stroke:#34465f}
      .ext{fill:#251f30;stroke:#463a5c}
      .box{fill:#212120;stroke:#55554f}
      .in{fill:#1e1e1d;stroke:#55554f}
      .key{fill:#212120;stroke:#e08a5f}
      .t{fill:#eceae4} .s{fill:#9a9a95} .z{fill:#8a8a85}
      .a{stroke:#8f8f8a} .ah{fill:#8f8f8a}
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="1192" height="300"/>

  <rect class="local" x="12" y="10" width="984" height="280" rx="14"/>
  <text class="z" x="28" y="280">ON YOUR MACHINE</text>
  <rect class="ext" x="1008" y="10" width="172" height="280" rx="14"/>
  <text class="z" x="1094" y="280" text-anchor="middle">EXTERNAL</text>

  <rect class="in" x="308" y="28" width="112" height="40" rx="8"/>
