  <text class="t" x="571" y="53" text-anchor="middle">Ontology</text>
  <path class="a" d="M364,68 V118" marker-end="url(#h)"/>
  <path class="a" d="M502,68 V118" marker-end="url(#h)"/>
  <path class="a" d="M640,68 V118" marker-end="url(#h)"/>

  <rect class="box" x="36" y="120" width="104" height="60" rx="10"/>
